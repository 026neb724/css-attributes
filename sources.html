<html>
    <head>
        <title> Commonly Used CSS Properties </title>

        <style>
        
            body {
                color: rgb(14, 14, 12);
                background-color: rgb(179, 179, 32);
                font-family: Arial, Helvetica, sans-serif;
                font-size: large;
                line-height: normal;
                letter-spacing: 0.5px;
                word-spacing: normal;
            }
            nav {
                display: flex;
                justify-content: space-between;
                padding: 15px 30px;
                background-color: darkkhaki;
                border:  2px solid black;
                box-shadow: 0 3px 8px gray;
            }

            nav h2 {
                color: white;font-weight: bold;
                font-style: italic;
                text-decoration: none;
            }

            nav a {
                color: white;
                text-decoration: none;
                text-transform: uppercase;
                margin: 10px;
                cursor: pointer;
            }

            nav a;:hover {
                color: grey;
            }

            .hero {
                 background-image: url("King/in/yellow.jpg");
    width: 80%;
    height: 300px;
    margin: 40px auto;
    padding: 40px;
    border-radius: 20px;
    opacity: 0.95;
    position: relative;
    overflow: hidden;
    text-align: center;
            }

        </style>
    </head>

</html>
